<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
     style="transform:rotate(0deg);transform-origin:50% 50%;">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B21D4"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pulse {
      0%   { opacity: 0.2; transform: scale(0.8); }
      50%  { opacity: 1;   transform: scale(1); }
      100% { opacity: 0.2; transform: scale(0.8); }
    }
    @keyframes pulse2 {
      0%   { opacity: 0.2; transform: scale(0.8); }
      50%  { opacity: 1;   transform: scale(1); }
      100% { opacity: 0.2; transform: scale(0.8); }
    }
    @keyframes pulse3 {
      0%   { opacity: 0.2; transform: scale(0.8); }
      50%  { opacity: 1;   transform: scale(1); }
      100% { opacity: 0.2; transform: scale(0.8); }
    }
    .d1 { animation: pulse  1s ease-in-out infinite; transform-origin: 6px 12px; }
    .d2 { animation: pulse  1s ease-in-out 0.33s infinite; transform-origin: 12px 12px; }
    .d3 { animation: pulse  1s ease-in-out 0.66s infinite; transform-origin: 18px 12px; }
  </style>
  <circle class="d1" cx="6" cy="12" r="2" fill="url(#g)"/>
  <circle class="d2" cx="12" cy="12" r="2" fill="url(#g)"/>
  <circle class="d3" cx="18" cy="12" r="2" fill="url(#g)"/>
</svg>
